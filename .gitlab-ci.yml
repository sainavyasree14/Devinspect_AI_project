stages:
  - review
  - build
  - test

devinspect-review:
  stage: review
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq git
  script:
    - |
      FILES=$(git diff --name-only HEAD~1 HEAD -- '*.js' '*.ts' '*.py' '*.jsx' '*.tsx' 2>/dev/null | head -5 || echo "")
      if [ -z "$FILES" ]; then
        echo "No relevant files changed, skipping review."
        exit 0
      fi
      for FILE in $FILES; do
        if [ -f "$FILE" ]; then
          echo "Reviewing: $FILE"
          CODE=$(cat "$FILE" | head -c 50000)
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$DEVINSPECT_API_URL/api/ci/review" \
            -H "X-API-Key: $DEVINSPECT_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"code\": $(echo "$CODE" | jq -Rs .), \"language\": \"javascript\", \"mode\": \"developer\"}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          if [ "$HTTP_CODE" = "200" ]; then
            SCORE=$(echo "$BODY" | jq -r '.analysis.score // "N/A"')
            echo "✅ $FILE — Score: $SCORE/100"
          else
            echo "⚠️  Review failed for $FILE (HTTP $HTTP_CODE)"
          fi
        fi
      done
  variables:
    # Set these in GitLab → Settings → CI/CD → Variables (masked)
    # DEVINSPECT_API_KEY: your_api_key
    # DEVINSPECT_API_URL: http://your-backend-url:5000
    GIT_DEPTH: "2"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  allow_failure: true  # Don't block pipeline if review service is down
